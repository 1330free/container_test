name: Generate CBOM from Keycloak Container

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scan-container-cbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install CBOMKit CLI
        run: |
          # 透過 Go 直接編譯安裝 CBOMKit
          go install github.com/IBM/cbomkit-cli@latest || go install github.com/CBOMKit/cbomkit@latest || true
          
          # 將 Go 二進位路徑加入系統 PATH
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Pull and Extract Keycloak Container Filesystem
        run: |
          IMAGE_NAME="quay.io/keycloak/keycloak:latest"
          echo "Pulling $IMAGE_NAME..."
          docker pull $IMAGE_NAME
          
          CONTAINER_ID=$(docker create $IMAGE_NAME)
          mkdir -p target-rootfs
          docker export $CONTAINER_ID | tar -xf - -C target-rootfs
          docker rm $CONTAINER_ID
          echo "Container filesystem extracted successfully."

      - name: Run CBOMKit Scan
        run: |
          mkdir -p cbom-output
          
          # 若 cbomkit-cli 指令存在則執行，若指令名為 cbomkit 亦可相容
          if command -v cbomkit-cli &> /dev/null; then
            cbomkit-cli generate --path ./target-rootfs --output ./cbom-output/keycloak-cbom.json
          elif command -v cbomkit &> /dev/null; then
            cbomkit scan ./target-rootfs --output ./cbom-output/keycloak-cbom.json
          else
            # 備用方案：若為 Docker 官方映像檔形式
            docker run --rm -v $(pwd)/target-rootfs:/scan -v $(pwd)/cbom-output:/out \
              ghcr.io/ibm/cbomkit:latest generate --path /scan --output /out/keycloak-cbom.json
          fi

      - name: Upload CBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-cbom-report
          path: ./cbom-output/keycloak-cbom.json
          retention-days: 14
