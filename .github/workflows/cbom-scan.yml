name: Generate CBOM from Keycloak Container

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scan-container-cbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install CBOMkit-theia
        run: |
          echo "正在安裝容器專用掃描工具 CBOMkit-theia..."
          # 安裝 PQCA 官方維護的 theia 掃描器
          go install github.com/cbomkit/cbomkit-theia@latest || go install github.com/PQCA/cbomkit-theia@latest
          
          # 將 Go 工具路徑加入環境變數
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run Native Image Scan
        run: |
          mkdir -p cbom-output
          IMAGE_NAME="quay.io/keycloak/keycloak:latest"
          
          echo "拉取容器映像檔: $IMAGE_NAME"
          docker pull $IMAGE_NAME
          
          echo "執行 CBOMkit-theia 掃描..."
          # Theia 支援直接傳入 image 名稱進行靜態解析，無需匯出 rootfs
          # 將標準輸出導向 JSON，並隔離錯誤日誌
          cbomkit-theia image $IMAGE_NAME > ./cbom-output/keycloak-cbom.json 2> scan_error.log
          
          # 若工具預設生成了其他的 json 檔案，則將其移至輸出目錄
          if [ ! -s "./cbom-output/keycloak-cbom.json" ] && ls *.json 1> /dev/null 2>&1; then
            mv *.json ./cbom-output/keycloak-cbom.json
          fi

      - name: Validate CBOM
        run: |
          if [ -s "./cbom-output/keycloak-cbom.json" ]; then
            echo "✅ CBOM 產出成功！檔案大小：$(du -h ./cbom-output/keycloak-cbom.json | cut -f1)"
          else
            echo "❌ 產出失敗或檔案為空，請檢查 scan_error.log"
            cat scan_error.log
            exit 1
          fi

      - name: Upload CBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-cbom-report
          path: ./cbom-output/keycloak-cbom.json
          retention-days: 14
