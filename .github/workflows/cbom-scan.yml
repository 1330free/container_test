name: Generate CBOM from Keycloak Container

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scan-container-cbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install CBOMKit CLI
        run: |
          go install github.com/IBM/cbomkit-cli@latest || true
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Extract Keycloak Filesystem (No Database Needed)
        run: |
          IMAGE_NAME="quay.io/keycloak/keycloak:latest"
          echo "拉取映像檔..."
          docker pull $IMAGE_NAME
          
          # 使用 create 建立靜態容器 (不要使用 docker run 或 docker start)
          CONTAINER_ID=$(docker create $IMAGE_NAME)
          
          # 匯出 rootfs 到本機目錄
          mkdir -p target-rootfs
          docker export $CONTAINER_ID | tar -xf - -C target-rootfs
          docker rm $CONTAINER_ID
          echo "已成功匯出檔案系統，略過資料庫啟動。"

      - name: Run CBOMKit Scan
        run: |
          mkdir -p cbom-output
          # 執行掃描
          cbomkit-cli generate --path ./target-rootfs --output ./cbom-output/keycloak-cbom.json

      - name: Validate CBOM
        run: |
          if [ -s "./cbom-output/keycloak-cbom.json" ]; then
            echo "✅ CBOM 產出成功！大小：$(du -h ./cbom-output/keycloak-cbom.json | cut -f1)"
          else
            echo "❌ 產出失敗或檔案為空"
            exit 1
          fi

      - name: Upload CBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-cbom-report
          path: ./cbom-output/keycloak-cbom.json
          retention-days: 14
